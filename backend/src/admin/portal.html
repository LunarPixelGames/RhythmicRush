<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RhythmicRush Admin Portal</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      color: #e0e0e0;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 30px;
      padding-bottom: 20px;
      border-bottom: 2px solid #0f3460;
    }

    h1 {
      font-size: 28px;
      color: #00d4ff;
      margin-bottom: 10px;
    }

    .status {
      font-size: 12px;
      color: #888;
    }

    .status.connected {
      color: #00d4ff;
    }

    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      border-bottom: 1px solid #0f3460;
    }

    button.tab {
      background: transparent;
      border: none;
      color: #888;
      padding: 12px 20px;
      cursor: pointer;
      font-size: 14px;
      border-bottom: 2px solid transparent;
      transition: all 0.3s;
    }

    button.tab.active {
      color: #00d4ff;
      border-bottom-color: #00d4ff;
    }

    button.tab:hover {
      color: #00d4ff;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    .panel {
      background: #0f1419;
      border: 1px solid #0f3460;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .panel h2 {
      font-size: 18px;
      margin-bottom: 15px;
      color: #00d4ff;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      font-size: 13px;
      margin-bottom: 5px;
      color: #aaa;
    }

    input, textarea, select {
      width: 100%;
      padding: 10px;
      background: #1a2332;
      border: 1px solid #0f3460;
      color: #e0e0e0;
      border-radius: 4px;
      font-family: inherit;
    }

    input:focus, textarea:focus, select:focus {
      outline: none;
      border-color: #00d4ff;
      box-shadow: 0 0 8px rgba(0, 212, 255, 0.2);
    }

    .button-group {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    button {
      padding: 10px 20px;
      background: #00d4ff;
      border: none;
      color: #0f1419;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      font-size: 13px;
      transition: all 0.3s;
    }

    button:hover {
      background: #00b8cc;
      transform: translateY(-2px);
    }

    button.danger {
      background: #ff4444;
      color: white;
    }

    button.danger:hover {
      background: #cc0000;
    }

    button.secondary {
      background: #444;
      color: #e0e0e0;
    }

    button.secondary:hover {
      background: #555;
    }

    .leaderboard-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
      font-size: 13px;
    }

    .leaderboard-table th {
      background: #1a2332;
      padding: 10px;
      text-align: left;
      border-bottom: 2px solid #0f3460;
      color: #00d4ff;
      font-weight: bold;
    }

    .leaderboard-table td {
      padding: 10px;
      border-bottom: 1px solid #0f3460;
    }

    .leaderboard-table tr:hover {
      background: #1a2332;
    }

    .leaderboard-table .banned {
      color: #ff4444;
      font-weight: bold;
    }

    .user-details {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      margin-top: 15px;
    }

    .detail-card {
      background: #1a2332;
      border: 1px solid #0f3460;
      border-radius: 4px;
      padding: 12px;
      font-size: 12px;
    }

    .detail-card strong {
      color: #00d4ff;
    }

    .level-stats {
      margin-top: 15px;
    }

    .level-stat {
      display: flex;
      justify-content: space-between;
      padding: 8px;
      border-bottom: 1px solid #0f3460;
      font-size: 12px;
    }

    .alert {
      padding: 12px;
      border-radius: 4px;
      margin-bottom: 15px;
      font-size: 13px;
    }

    .alert.success {
      background: rgba(0, 200, 100, 0.1);
      border: 1px solid #00c864;
      color: #00ff88;
    }

    .alert.error {
      background: rgba(255, 68, 68, 0.1);
      border: 1px solid #ff4444;
      color: #ff8888;
    }

    .alert.info {
      background: rgba(0, 212, 255, 0.1);
      border: 1px solid #00d4ff;
      color: #00ffff;
    }

    .loading {
      text-align: center;
      color: #888;
      padding: 20px;
    }

    .spinner {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 2px solid #0f3460;
      border-top-color: #00d4ff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🎮 RhythmicRush Admin Portal</h1>
      <p class="status" id="status">⏳ Initializing...</p>
    </header>

    <div class="tabs">
      <button class="tab active" onclick="switchTab('leaderboard')">Leaderboard</button>
      <button class="tab" onclick="switchTab('user')">User Management</button>
      <button class="tab" onclick="switchTab('logout')">Logout</button>
    </div>

    <!-- Leaderboard Tab -->
    <div id="leaderboard" class="tab-content active">
      <div class="panel">
        <h2>Global Leaderboard</h2>
        <div class="button-group">
          <button onclick="loadLeaderboard()">📊 Refresh Leaderboard</button>
          <input type="number" id="leaderboardLimit" placeholder="Limit (default 100)" min="1" max="1000" style="width: 200px;">
        </div>
        <div id="leaderboardContainer" style="margin-top: 20px;"></div>
      </div>
    </div>

    <!-- User Management Tab -->
    <div id="user" class="tab-content">
      <div class="panel">
        <h2>User Lookup & Moderation</h2>
        <div class="form-group">
          <label>User UID</label>
          <input type="text" id="userUid" placeholder="Enter Firebase UID...">
        </div>
        <div class="button-group">
          <button onclick="loadUserDetails()">🔍 Load User Details</button>
          <button class="secondary" onclick="clearUserPanel()">Clear</button>
        </div>
      </div>

      <div id="userDetailsPanel" style="display: none;">
        <div class="panel">
          <h2>User Information</h2>
          <div id="userInfo"></div>
        </div>

        <div class="panel">
          <h2>Moderation Actions</h2>
          <div class="form-group">
            <label>Ban Status</label>
            <div style="display: flex; gap: 10px;">
              <button onclick="banUser(true)" class="danger">🚫 Ban from Leaderboard</button>
              <button onclick="banUser(false)" class="secondary">✅ Unban</button>
            </div>
          </div>

          <div class="form-group">
            <label>Ban Reason (optional)</label>
            <textarea id="banReason" placeholder="e.g., Suspected cheating, Offensive username, etc." rows="3"></textarea>
          </div>

          <div class="form-group">
            <label>Rename User</label>
            <div style="display: flex; gap: 10px;">
              <input type="text" id="newUsername" placeholder="New username..." style="flex: 1;">
              <button onclick="renameUser(false)">✏️ Rename</button>
              <button onclick="renameUser(true)" class="secondary">🔄 Force Rename</button>
            </div>
          </div>

          <div class="form-group">
            <label></label>
            <button onclick="deleteUser()" class="danger">🗑️ Delete Account & Data</button>
          </div>
        </div>

        <div class="panel">
          <h2>Game Statistics</h2>
          <div id="gameStats"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = `${window.location.origin}/v1/dev`;
    let idToken = null;

    // Initialize
    window.addEventListener('load', async () => {
      await initializeAuth();
      updateStatus();
    });

    async function initializeAuth() {
      try {
        // Check if we have a stored token
        const stored = localStorage.getItem('admin_token');
        if (stored) {
          idToken = stored;
          return;
        }

        // For demo, we'll require manual token entry
        const token = prompt('Enter your Firebase ID token:', '');
        if (!token) {
          updateStatus('❌ No token provided', false);
          return;
        }
        idToken = token;
        localStorage.setItem('admin_token', token);
      } catch (e) {
        console.error('Auth error:', e);
        updateStatus('❌ Authentication failed', false);
      }
    }

    function updateStatus(message = '✅ Connected', connected = true) {
      const el = document.getElementById('status');
      el.textContent = message;
      el.className = connected ? 'status connected' : 'status';
    }

    function switchTab(tabName) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));

      if (tabName === 'logout') {
        localStorage.removeItem('admin_token');
        idToken = null;
        updateStatus('❌ Logged out', false);
        location.reload();
        return;
      }

      document.getElementById(tabName).classList.add('active');
      event.target.classList.add('active');
    }

    async function fetchAPI(endpoint, options = {}) {
      if (!idToken) {
        updateStatus('❌ Not authenticated', false);
        throw new Error('Not authenticated');
      }

      try {
        const response = await fetch(`${API_BASE}${endpoint}`, {
          ...options,
          headers: {
            'Authorization': `Bearer ${idToken}`,
            'Content-Type': 'application/json',
            ...options.headers,
          },
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error?.message || 'API error');
        }

        return data.data;
      } catch (e) {
        console.error('API error:', e);
        showAlert(`Error: ${e.message}`, 'error');
        throw e;
      }
    }

    async function loadLeaderboard() {
      const limit = document.getElementById('leaderboardLimit').value || 100;
      const container = document.getElementById('leaderboardContainer');
      container.innerHTML = '<div class="loading"><div class="spinner"></div> Loading...</div>';

      try {
        const data = await fetchAPI(`/leaderboard?limit=${limit}`);
        let html = `
          <table class="leaderboard-table">
            <thead>
              <tr>
                <th>Rank</th>
                <th>UID</th>
                <th>Username</th>
                <th>Points</th>
                <th>Levels</th>
                <th>Eligible</th>
                <th>Status</th>
                <th>Banned</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody>
        `;

        data.forEach((entry, idx) => {
          const banned = entry.leaderboard_banned === 1 ? '🚫 Yes' : 'No';
          const eligible = entry.eligible === 1 ? '✅' : '❌';
          html += `
            <tr ${entry.leaderboard_banned === 1 ? 'style="opacity: 0.6;"' : ''}>
              <td>${idx + 1}</td>
              <td>${entry.uid.substring(0, 8)}...</td>
              <td>${entry.username || '(unnamed)'}</td>
              <td>${entry.points}</td>
              <td>${entry.completed_levels}</td>
              <td>${eligible}</td>
              <td>${entry.status}</td>
              <td class="${entry.leaderboard_banned === 1 ? 'banned' : ''}">${banned}</td>
              <td><button class="secondary" onclick="document.getElementById('userUid').value='${entry.uid}'; loadUserDetails();">View</button></td>
            </tr>
          `;
        });

        html += '</tbody></table>';
        container.innerHTML = html;
      } catch (e) {
        container.innerHTML = `<div class="alert error">Failed to load leaderboard</div>`;
      }
    }

    async function loadUserDetails() {
      const uid = document.getElementById('userUid').value.trim();
      if (!uid) {
        showAlert('Please enter a UID', 'error');
        return;
      }

      try {
        const data = await fetchAPI(`/user?uid=${uid}`);
        displayUserDetails(data);
        document.getElementById('userDetailsPanel').style.display = 'block';
      } catch (e) {
        showAlert('User not found or error loading details', 'error');
        document.getElementById('userDetailsPanel').style.display = 'none';
      }
    }

    function displayUserDetails(data) {
      let html = '';

      if (data.account) {
        const acc = data.account;
        html += `
          <div class="detail-card">
            <strong>UID:</strong> ${acc.uid}<br>
            <strong>Username:</strong> ${acc.username || '(none)'}<br>
            <strong>Email Verified:</strong> ${acc.email_verified ? '✅' : '❌'}<br>
            <strong>Status:</strong> ${acc.status}<br>
            <strong>Leaderboard Banned:</strong> ${acc.leaderboard_banned === 1 ? '🚫 Yes' : 'No'}<br>
            ${acc.leaderboard_ban_reason ? `<strong>Ban Reason:</strong> ${acc.leaderboard_ban_reason}<br>` : ''}
            <strong>Created:</strong> ${new Date(acc.created_at).toLocaleString()}<br>
            <strong>Updated:</strong> ${new Date(acc.updated_at).toLocaleString()}
          </div>
        `;
      }

      if (data.save) {
        const save = data.save;
        html += `
          <div class="detail-card">
            <strong>Points:</strong> ${save.points}<br>
            <strong>Coins Earned:</strong> ${save.earned_coins}<br>
            <strong>Levels Completed:</strong> ${save.completed_levels}<br>
            <strong>Total Attempts:</strong> ${save.schema_version}<br>
            <strong>Last Played:</strong> ${new Date(save.updated_at).toLocaleString()}
          </div>
        `;
      }

      // Level stats
      if (data.level_progress && data.level_progress.length > 0) {
        html += '<div class="level-stats">';
        html += '<strong>Level Progress:</strong>';
        data.level_progress.forEach(lp => {
          html += `
            <div class="level-stat">
              <span>Level ${lp.level_id}: ${lp.best_percent}% ${lp.completed === 1 ? '✅ Done' : '⏳ In Progress'}</span>
              <span>${new Date(lp.updated_at).toLocaleString()}</span>
            </div>
          `;
        });
        html += '</div>';
      }

      // Device attempts
      if (data.device_attempts && data.device_attempts.length > 0) {
        html += '<div style="margin-top: 15px;"><strong>Device Attempts Summary:</strong>';
        data.device_attempts.forEach(da => {
          html += `<div class="level-stat"><span>Device ${da.device_id.substring(0, 8)}...</span> <span>${da.accepted_total} attempts</span></div>`;
        });
        html += '</div>';
      }

      document.getElementById('userInfo').innerHTML = html;
    }

    async function banUser(ban) {
      const uid = document.getElementById('userUid').value.trim();
      const reason = document.getElementById('banReason').value.trim();

      if (!uid) {
        showAlert('Please enter a UID', 'error');
        return;
      }

      if (!confirm(`Are you sure you want to ${ban ? 'ban' : 'unban'} this user?`)) return;

      try {
        await fetchAPI('/user', {
          method: 'POST',
          body: JSON.stringify({
            action: 'ban',
            uid,
            ban,
            reason: reason || null,
          }),
        });
        showAlert(`User ${ban ? 'banned' : 'unbanned'} successfully!`, 'success');
        loadUserDetails();
      } catch (e) {
        showAlert('Failed to update ban status', 'error');
      }
    }

    async function renameUser(force) {
      const uid = document.getElementById('userUid').value.trim();
      const newUsername = document.getElementById('newUsername').value.trim();

      if (!uid || !newUsername) {
        showAlert('Please enter a UID and new username', 'error');
        return;
      }

      if (!confirm(`Rename user to "${newUsername}"?`)) return;

      try {
        await fetchAPI('/user', {
          method: 'POST',
          body: JSON.stringify({
            action: 'rename',
            uid,
            newUsername,
            force,
          }),
        });
        showAlert('User renamed successfully!', 'success');
        loadUserDetails();
      } catch (e) {
        showAlert('Failed to rename user', 'error');
      }
    }

    async function deleteUser() {
      const uid = document.getElementById('userUid').value.trim();

      if (!uid) {
        showAlert('Please enter a UID', 'error');
        return;
      }

      if (!confirm(`⚠️ DELETE ALL DATA FOR UID ${uid}? This cannot be undone!`)) return;
      if (!confirm('Are you absolutely sure? Type YES to confirm.')) return;

      try {
        await fetchAPI('/user', {
          method: 'POST',
          body: JSON.stringify({
            action: 'delete',
            uid,
          }),
        });
        showAlert('User and all data deleted!', 'success');
        clearUserPanel();
      } catch (e) {
        showAlert('Failed to delete user', 'error');
      }
    }

    function clearUserPanel() {
      document.getElementById('userUid').value = '';
      document.getElementById('userDetailsPanel').style.display = 'none';
    }

    function showAlert(message, type = 'info') {
      const alertEl = document.createElement('div');
      alertEl.className = `alert ${type}`;
      alertEl.textContent = message;
      document.querySelector('.container').insertBefore(alertEl, document.querySelector('.tabs'));
      setTimeout(() => alertEl.remove(), 5000);
    }
  </script>
</body>
</html>
